<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Clean Notes</title>
    <meta name="description" content="Notebooks, nested tags, daily notes, tasks and PDFs. Stored on your device." />
    <meta name="theme-color" content="#f5f2eb" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script>
      // Set the theme before first paint so dark mode never flashes white.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('cn.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
